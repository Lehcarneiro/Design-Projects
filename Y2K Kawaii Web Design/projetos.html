      </a>
    </div>
    <p class="projects-empty" id="projectsEmpty" hidden>Nenhum projeto encontrado.</p>
  </section>
</main>

<script>
  (function () {
    function normalizeText(text) {
      var value = (text || "").toLowerCase();

      if (value.normalize) {
        value = value.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      }

      return value;
    }

    function initProjectSearch() {
      var searchInput = document.getElementById("projectSearchInput");
      var searchBtn = document.getElementById("projectSearchBtn");
      var projectCards = document.querySelectorAll(".project-card");
      var emptyState = document.getElementById("projectsEmpty");

      if (!searchInput || !searchBtn || !projectCards.length || !emptyState) {
        return;
      }

      function filterProjects() {
        var query = normalizeText(searchInput.value.replace(/^\s+|\s+$/g, ""));
        var visibleCount = 0;
        var i;

        for (i = 0; i < projectCards.length; i += 1) {
          var card = projectCards[i];
          var cardTitle = card.getAttribute("data-title") || card.textContent || "";
          var isMatch = normalizeText(cardTitle).indexOf(query) !== -1;

          card.style.display = isMatch ? "flex" : "none";

          if (isMatch) {
            visibleCount += 1;
          }
        }

        emptyState.style.display = visibleCount === 0 ? "block" : "none";
      }

      searchInput.addEventListener("input", filterProjects);
      searchInput.addEventListener("keyup", function (event) {
        if (event.key === "Enter") {
          filterProjects();
        }
      });
      searchBtn.addEventListener("click", filterProjects);

      filterProjects();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initProjectSearch);
    } else {
      initProjectSearch();
    }
  })();
</script>
</body>
